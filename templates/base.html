<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid Post-Quantum Digital Signature Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root {
    --bg-canvas: #f3f9f8;
    --surface: #ffffff;
    --surface-muted: #e6f4f1;
    --border-hairline: #cde5e0;
    --ink-primary: #0f172a;
    --ink-secondary: #475569;
    --ink-muted: #64748b;
    --brand: #0f766e;
    --brand-hover: #115e59;
    --brand-contrast: #ffffff;
    --navbar-bg: #0f766e;
    --navbar-border: #115e59;
    --navbar-ink: #ffffff;
    --navbar-muted: #ccfbf1;
    --navbar-active-bg: #ffffff;
    --navbar-active-ink: #0f766e;
    --accent-soft: #f0fdfa;
    --accent-ink: #0f766e;
    --valid-bg: #f0fdf4;
    --valid-border: #bbf7d0;
    --valid-head-ink: #14532d;
    --valid-ink: #15803d;
    --valid-shield-bg: #dcfce7;
    --invalid-bg: #fef2f2;
    --invalid-border: #fecaca;
    --invalid-head-ink: #7f1d1d;
    --invalid-ink: #b91c1c;
    --invalid-shield-bg: #fee2e2;
    --warn-bg: #fffbeb;
    --warn-border: #fde68a;
    --warn-ink: #b45309;
    --hash-bg: #f8fafc;
    --input-bg: #ffffff;
    --input-border: #cbd5e1;
  }

  body {
    background: var(--bg-canvas);
    color: var(--ink-primary);
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, .judul-halaman, .navbar-brand, .status-besar {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }

  /* Top Navigation */
  .navbar-app {
    background: var(--navbar-bg);
    border-bottom: 1px solid var(--navbar-border);
    padding: 0.75rem 0;
  }
  .navbar-app .navbar-brand {
    color: var(--navbar-ink);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.02em;
    white-space: nowrap;
    cursor: default;
    user-select: none;
    margin-right: 0;
  }
  .navbar-app .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--navbar-active-bg);
    color: var(--navbar-active-ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
  }
  .navbar-app .brand-divider {
    width: 1px;
    height: 26px;
    background: rgba(255, 255, 255, 0.25);
    margin: 0 1.25rem;
  }
  .navbar-app .nav-link {
    white-space: nowrap;
    color: var(--navbar-muted);
    font-size: 0.875rem;
    font-weight: 500;
    padding: 0.45rem 0.85rem;
    border-radius: 8px;
    transition: color 0.15s ease, background-color 0.15s ease;
  }
  .navbar-app .nav-link:hover {
    color: var(--navbar-ink);
    background: rgba(148, 163, 184, 0.16);
  }
  .navbar-app .nav-link.active {
    color: var(--navbar-active-ink);
    background: var(--navbar-active-bg);
    font-weight: 600;
  }
  .btn-reset-session {
    border: 1px solid rgba(148, 163, 184, 0.35);
    background: transparent;
    color: var(--navbar-ink);
    font-size: 0.8125rem;
    font-weight: 500;
    padding: 0.4rem 0.85rem;
    border-radius: 8px;
    white-space: nowrap;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .btn-reset-session:hover {
    background: var(--invalid-bg);
    color: var(--invalid-ink);
    border-color: var(--invalid-border);
  }

  /* Page Headings */
  .page-header {
    margin-bottom: 1.75rem;
  }
  .judul-halaman {
    font-weight: 700;
    font-size: 1.625rem;
    letter-spacing: -0.025em;
    color: var(--ink-primary);
    margin-bottom: 0.35rem;
  }
  .page-subtitle {
    color: var(--ink-secondary);
    font-size: 0.9375rem;
    line-height: 1.55;
    max-width: 72ch;
    margin-bottom: 0;
  }
  .text-muted-custom {
    color: var(--ink-muted) !important;
  }
  .text-emphasis {
    color: var(--ink-primary) !important;
  }

  /* Cards & Surfaces */
  .card {
    background: var(--surface);
    color: var(--ink-primary);
    border: 1px solid var(--border-hairline);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
  }
  .card-header {
    background: transparent;
    border-bottom: 1px solid var(--border-hairline);
    padding: 0.95rem 1.35rem;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--ink-primary);
    border-radius: 16px 16px 0 0 !important;
  }
  .card-body {
    padding: 1.35rem;
  }
  .card-footer {
    background: var(--surface-muted);
    border-top: 1px solid var(--border-hairline);
    padding: 0.85rem 1.35rem;
    color: var(--ink-secondary);
    border-radius: 0 0 16px 16px !important;
  }

  /* Forms & Primary Buttons */
  .form-label {
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--ink-primary);
    margin-bottom: 0.4rem;
  }
  .form-control, .form-select {
    border: 1px solid var(--input-border);
    border-radius: 10px;
    padding: 0.55rem 0.85rem;
    font-size: 0.875rem;
    color: var(--ink-primary);
    background-color: var(--input-bg);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-control:focus, .form-select:focus {
    border-color: var(--brand);
    background-color: var(--input-bg);
    color: var(--ink-primary);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }
  .btn-primary {
    background-color: var(--brand);
    border-color: var(--brand);
    color: var(--brand-contrast);
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.875rem;
    padding: 0.6rem 1.1rem;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .btn-primary:hover, .btn-primary:focus-visible {
    background-color: var(--brand-hover);
    border-color: var(--brand-hover);
    color: var(--brand-contrast);
  }
  .btn-outline-primary {
    color: var(--ink-primary);
    border-color: var(--input-border);
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    background: var(--surface);
  }
  .btn-outline-primary:hover {
    background: var(--surface-muted);
    border-color: var(--brand);
    color: var(--ink-primary);
  }

  /* Notices & Banners */
  .notice-box {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.875rem 1.1rem;
    border-radius: 12px;
    font-size: 0.875rem;
    line-height: 1.5;
    border: 1px solid transparent;
    margin-bottom: 1.25rem;
  }
  .notice-box.notice-warn {
    background: var(--warn-bg);
    border-color: var(--warn-border);
    color: var(--warn-ink);
  }
  .notice-box.notice-info {
    background: var(--accent-soft);
    border-color: var(--border-hairline);
    color: var(--accent-ink);
  }
  .notice-box.notice-success {
    background: var(--valid-bg);
    border-color: var(--valid-border);
    color: var(--valid-head-ink);
  }
  .notice-box.notice-muted {
    background: var(--surface-muted);
    border-color: var(--border-hairline);
    color: var(--ink-secondary);
  }

  /* Image Viewport */
  .preview-frame {
    background: #060a13;
    border: 1px solid var(--border-hairline);
    border-radius: 12px;
    padding: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pratinjau {
    max-width: 100%;
    max-height: 390px;
    border-radius: 8px;
    background: #000;
    display: block;
    margin: 0 auto;
    object-fit: contain;
  }
  .empty-viewport {
    border: 1px dashed var(--input-border);
    border-radius: 12px;
    background: var(--surface-muted);
    padding: 3.25rem 1.5rem;
    text-align: center;
    color: var(--ink-muted);
  }

  /* Monospace & Tabular Data */
  .mono {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8rem;
    word-break: break-all;
    line-height: 1.55;
  }
  .hash-box {
    background: var(--hash-bg);
    border: 1px solid var(--border-hairline);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    color: var(--ink-primary);
  }
  .num-tabular {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  .beda {
    background: var(--invalid-shield-bg);
    color: var(--invalid-ink);
    font-weight: 700;
    border-radius: 3px;
    padding: 0 2px;
  }

  /* Clean Tables */
  table.table-clean {
    --bs-table-bg: transparent;
    --bs-table-color: var(--ink-primary);
    --bs-table-hover-bg: var(--surface-muted);
    --bs-table-hover-color: var(--ink-primary);
    margin-bottom: 0;
    font-size: 0.875rem;
  }
  .table-head-surface {
    background: var(--surface-muted) !important;
  }
  table.table-clean th {
    color: var(--ink-muted);
    font-weight: 500;
    font-size: 0.8125rem;
    padding: 0.7rem 0.75rem;
    border-color: var(--border-hairline);
    vertical-align: top;
  }
  table.table-clean td {
    color: var(--ink-primary);
    padding: 0.7rem 0.75rem;
    border-color: var(--border-hairline);
    vertical-align: middle;
  }
  table.table-clean tr:last-child th,
  table.table-clean tr:last-child td {
    border-bottom: 0;
  }

  /* Semantic Status Text Marks */
  .state-mark {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8125rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .state-mark.is-ok { color: var(--valid-ink); }
  .state-mark.is-fail { color: var(--invalid-ink); }
  .state-mark.is-idle { color: var(--ink-muted); }

  /* Verification Result Card */
  .verify-box {
    border: 1px solid var(--border-hairline);
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface);
  }
  .verify-box-head {
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border-hairline);
  }
  .verify-box-head.is-valid {
    background: var(--valid-bg);
    border-bottom-color: var(--valid-border);
    color: var(--valid-head-ink);
  }
  .verify-box-head.is-invalid {
    background: var(--invalid-bg);
    border-bottom-color: var(--invalid-border);
    color: var(--invalid-head-ink);
  }
  .verify-shield {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    flex-shrink: 0;
  }
  .is-valid .verify-shield { background: var(--valid-shield-bg); color: var(--valid-ink); }
  .is-invalid .verify-shield { background: var(--invalid-shield-bg); color: var(--invalid-ink); }
  .status-besar {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.2;
  }
  .verify-reason-bar {
    background: var(--surface);
    color: var(--ink-secondary);
    padding: 0.85rem 1.25rem;
    font-size: 0.8125rem;
  }

  /* Transit Flow Strip (verifikasi.html) */
  .flow-strip {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 767.98px) {
    .flow-strip {
      grid-template-columns: 1fr;
    }
    .panah-alur {
      transform: rotate(90deg);
      justify-self: center;
    }
  }
  .langkah-alur {
    background: var(--surface);
    border: 1px solid var(--border-hairline);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    text-align: center;
    height: 100%;
  }
  .langkah-alur.gangguan {
    background: var(--warn-bg);
    border-color: var(--warn-border);
  }
  .panah-alur {
    font-size: 1.25rem;
    color: var(--ink-muted);
  }

  /* Performance Bar Charts (kinerja.html) */
  .bar-track {
    width: 100%;
    height: 10px;
    border-radius: 999px;
    background: var(--surface-muted);
    overflow: hidden;
    margin-top: 0.35rem;
    margin-bottom: 0.9rem;
  }
  .batang {
    height: 100%;
    border-radius: 999px;
    min-width: 4px;
    transition: width 0.25s ease;
  }

  footer.app-footer {
    margin-top: auto;
    border-top: 1px solid var(--border-hairline);
    background: var(--surface);
    color: var(--ink-muted);
    font-size: 0.8125rem;
    padding: 1.1rem 0;
  }
</style>
</head>
<body>
<nav class="navbar navbar-expand-xl navbar-dark navbar-app sticky-top">
  <div class="container-xl px-3 px-lg-4">
    <div class="navbar-brand d-flex align-items-center gap-2">
      <span class="brand-mark"><i class="bi bi-shield-lock-fill"></i></span>
      <span>Hybrid PQ Signature Simulator</span>
    </div>

    <div class="brand-divider d-none d-xl-block"></div>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto gap-1 mt-2 mt-xl-0">
        <li class="nav-item"><a class="nav-link {{ 'active' if halaman=='sign' }}" href="{{ url_for('sign') }}"><i class="bi bi-pen me-1"></i> Sign Image</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if halaman=='verifikasi' }}" href="{{ url_for('verifikasi') }}"><i class="bi bi-patch-check me-1"></i> Status and Verification</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if halaman=='eksternal' }}" href="{{ url_for('eksternal') }}"><i class="bi bi-file-earmark-arrow-up me-1"></i> External File Verification</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if halaman=='kinerja' }}" href="{{ url_for('kinerja') }}"><i class="bi bi-bar-chart-line me-1"></i> Performance Comparison</a></li>
      </ul>
      <a class="btn btn-reset-session mt-2 mt-xl-0" href="{{ url_for('reset') }}" onclick="return confirm('Delete all data in this session?')">
        <i class="bi bi-arrow-counterclockwise me-1"></i>Reset session
      </a>
    </div>
  </div>
</nav>

<main class="container-xl px-3 px-lg-4 py-4 py-lg-5 flex-grow-1">
{% block isi %}{% endblock %}
</main>

<footer class="app-footer">
  <div class="container-xl px-3 px-lg-4 d-flex flex-wrap justify-content-between align-items-center gap-2">
    <span>ECDSA P-256 + ML-DSA / Falcon / SLH-DSA (liboqs)</span>
    <span>Data is kept only during this session.</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
