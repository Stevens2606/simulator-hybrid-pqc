<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid Post-Quantum Digital Signature Simulator</title>
<!-- Bootstrap 5 dan Bootstrap Icons (CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root { --utama:#1F3B57; --utama-muda:#E8EEF6; }
  body { background:#F4F6FA; }
  .navbar { background:var(--utama); }
  .navbar .nav-link { white-space:nowrap; color:#cfd8e6; border-radius:8px; padding:.45rem .8rem; }
  .navbar .nav-link:hover { color:#fff; background:rgba(255,255,255,.08); }
  .navbar .nav-link.active { color:var(--utama); background:#fff; font-weight:600; }
  .judul-halaman { font-weight:700; color:var(--utama); }
  .card { border:0; border-radius:14px; box-shadow:0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04); }
  .card-header { background:#fff; border-bottom:1px solid #eef1f5; font-weight:600; border-radius:14px 14px 0 0 !important; }
  .kartu-fitur { transition:transform .15s, box-shadow .15s; }
  .kartu-fitur:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(16,24,40,.10); }
  .ikon-fitur { width:42px; height:42px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; font-size:1.3rem; }
  .kotak-input { background:#EAF1FB; border-radius:10px; padding:.75rem .9rem; height:100%; }
  .kotak-output { background:#E9F6EC; border-radius:10px; padding:.75rem .9rem; height:100%; }
  .kotak-input ol, .kotak-input ul, .kotak-output ul { margin:.35rem 0 0; padding-left:1.1rem; }
  .pratinjau { max-width:100%; max-height:420px; border-radius:10px; background:#000; display:block; margin:0 auto; }
  .mono { font-family:Consolas, "Courier New", monospace; font-size:.82rem; word-break:break-all; }
  .beda { background:#F8D7DA; color:#B02A37; font-weight:700; border-radius:2px; }
  .langkah-alur { background:var(--utama-muda); border-radius:12px; padding:.7rem 1rem; text-align:center; height:100%; }
  .langkah-alur.gangguan { background:#FFF3CD; }
  .panah-alur { font-size:1.6rem; color:var(--utama); }
  .angka-besar { font-size:2rem; font-weight:700; color:var(--utama); line-height:1.1; }
  .status-besar { font-size:1.6rem; font-weight:800; letter-spacing:.5px; }
  .batang { height:12px; border-radius:6px; min-width:3px; }
  table.table th { color:#475467; font-weight:600; }
  footer { color:#98A2B3; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-xl navbar-dark shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="{{ url_for('sign') }}">
      <i class="bi bi-shield-lock-fill"></i> Hybrid PQ Signature Simulator
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto gap-xl-1 mt-2 mt-xl-0">
        <li class="nav-item"><a class="nav-link {{ 'active' if halaman=='sign' }}" href="{{ url_for('sign') }}"><i class="bi bi-pen me-1"></i>Sign Image</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if halaman=='verifikasi' }}" href="{{ url_for('verifikasi') }}"><i class="bi bi-patch-check me-1"></i>Status and Verification</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if halaman=='eksternal' }}" href="{{ url_for('eksternal') }}"><i class="bi bi-file-earmark-arrow-up me-1"></i>External File Verification</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if halaman=='kinerja' }}" href="{{ url_for('kinerja') }}"><i class="bi bi-bar-chart-line me-1"></i>Performance Comparison</a></li>
      </ul>
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('reset') }}" onclick="return confirm('Delete all data in this session?')">
        <i class="bi bi-arrow-counterclockwise me-1"></i>Reset session</a>
    </div>
  </div>
</nav>

<main class="container py-4">
{% block isi %}{% endblock %}
</main>

<footer class="container pb-4 small text-center">
  ECDSA P-256 + ML-DSA / Falcon / SLH-DSA (liboqs) · Data is kept only during this session.
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
