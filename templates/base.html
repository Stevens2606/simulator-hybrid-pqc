<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator Hybrid PQC Citra Medis</title>
<style>
  :root { --biru:#33415C; --biru-muda:#E7EEF7; --abu:#5b6472; --garis:#d8dde5;
          --hijau:#2E6B30; --hijau-muda:#D4EDDA; --merah:#A33; --merah-muda:#F8D7DA; --kuning:#FFF3CD; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, sans-serif; color:#1d232b; background:#f5f7fa; }
  header { background:var(--biru); color:#fff; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 20px; }
  .bar-atas { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .judul { padding:12px 0; font-size:17px; font-weight:600; }
  nav { display:flex; gap:6px; flex-wrap:wrap; padding-bottom:10px; }
  nav a { color:#fff; text-decoration:none; padding:7px 12px; font-size:14px; border:1px solid #ffffff55; border-radius:6px; }
  nav a.aktif { background:#fff; color:var(--biru); font-weight:600; }
  .reset { color:#dfe7f3; font-size:12px; }
  main { padding:22px 0 48px; }
  h1 { font-size:21px; margin:0 0 4px; }
  .sub { color:var(--abu); margin:0 0 18px; font-size:14px; }
  .kartu { background:#fff; border:1px solid var(--garis); border-radius:10px; padding:18px; margin-bottom:16px; }
  .kartu h2 { font-size:15px; margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  label { font-size:14px; font-weight:600; display:block; margin:10px 0 6px; }
  select, input[type=file] { width:100%; padding:8px; border:1px solid var(--garis); border-radius:6px; background:#fff; font-size:14px; }
  button, .tombol { display:inline-block; margin-top:14px; background:var(--hijau); color:#fff; border:0; border-radius:6px;
                    padding:9px 16px; font-size:14px; cursor:pointer; text-decoration:none; }
  .tombol.biru { background:var(--biru); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--garis); vertical-align:top; }
  th { background:var(--biru-muda); font-weight:600; }
  td.angka, th.angka { text-align:right; font-variant-numeric:tabular-nums; }
  .status { border-radius:10px; padding:14px 16px; margin-bottom:14px; border:1px solid; }
  .status.valid { background:var(--hijau-muda); border-color:var(--hijau); }
  .status.tidak { background:var(--merah-muda); border-color:var(--merah); }
  .status b.besar { font-size:22px; }
  .valid b.besar { color:var(--hijau); } .tidak b.besar { color:var(--merah); }
  .pesan { background:var(--kuning); border:1px solid #e0b84c; padding:10px 14px; border-radius:6px; margin-bottom:16px; font-size:14px; }
  img.pratinjau { max-width:100%; border:1px solid var(--garis); border-radius:6px; background:#000; display:block; }
  .mono { font-family:Consolas, monospace; font-size:12.5px; word-break:break-all; }
  .kecil { font-size:13px; color:var(--abu); }
  .lencana { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:600; }
  .ya { background:var(--hijau-muda); color:var(--hijau); } .tdk { background:var(--merah-muda); color:var(--merah); }
  .grafik { height:14px; border-radius:3px; min-width:2px; }
  .daftar label { font-weight:400; display:flex; gap:8px; align-items:center; margin:6px 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar-atas">
      <div class="judul">Simulator Hybrid PQC Citra Medis</div>
      <a class="reset" href="{{ url_for('reset') }}" onclick="return confirm('Hapus semua data sesi ini?')">Reset sesi</a>
    </div>
    <nav>
      <a href="{{ url_for('sign') }}" class="{{ 'aktif' if halaman=='sign' }}">Sign Citra</a>
      <a href="{{ url_for('verifikasi') }}" class="{{ 'aktif' if halaman=='verifikasi' }}">Status dan Verifikasi</a>
      <a href="{{ url_for('eksternal') }}" class="{{ 'aktif' if halaman=='eksternal' }}">Verifikasi File Eksternal</a>
      <a href="{{ url_for('kinerja') }}" class="{{ 'aktif' if halaman=='kinerja' }}">Perbandingan Kinerja</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block isi %}{% endblock %}
</main>
</body>
</html>
